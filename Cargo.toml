[workspace]
members = ["crates/*"]
resolver = "3"

# Shared dependency versions for every workspace crate. Crates reference these
# with `{ workspace = true }` so swc/serde/etc. stay on one version everywhere.
[workspace.dependencies]
mangler-core = { path = "crates/mangler-core" }
mangler-passgraph = { path = "crates/mangler-passgraph" }
mangler-jsast = { path = "crates/mangler-jsast" }
mangler-vm = { path = "crates/mangler-vm" }
mangler-config = { path = "crates/mangler-config" }
mangler-js = { path = "crates/mangler-js" }
mangler-css = { path = "crates/mangler-css" }
mangler-html = { path = "crates/mangler-html" }
mangler-testkit = { path = "crates/mangler-testkit" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
rayon = "1"
glob = "0.3"
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
lightningcss = "1.0.0-alpha.71"
swc_core = { version = "78", features = [
    "common",
    "common_concurrent",
    "ecma_ast",
    "ecma_parser",
    "ecma_codegen",
    "ecma_minifier",
    "ecma_transforms",
    "ecma_transforms_compat",
    "ecma_transforms_proposal",
    "ecma_helpers_inline",
    "ecma_utils",
    "ecma_visit",
] }
rquickjs = { version = "0.12", features = ["loader"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
swc_ecma_regexp = { path = "vendor/swc_ecma_regexp-0.15.0" }
swc_ecma_parser = { path = "vendor/swc_ecma_parser-45.1.1" }
swc_ecma_transforms_base = { path = "vendor/swc_ecma_transforms_base-49.0.1" }

# The embedded compiler must fit browser main-thread WebAssembly compilation.
# Native CLI throughput keeps the release profile's level-3 optimization.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
