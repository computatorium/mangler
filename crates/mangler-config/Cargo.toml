[package]
name = "mangler-config"
version = "0.2.0"
edition = "2024"
description = "Intent-vs-tuning config split, single-source clap+serde flags, declarative presets, and TryFrom validation."

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
glob = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rand = { workspace = true, features = ["thread_rng"] }

[dev-dependencies]
toml = { workspace = true }
