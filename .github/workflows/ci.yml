name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: semantics + real engines + release budgets
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require explicitly configured real engines
        run: |
          echo "MANGLER_TESTKIT_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "MANGLER_TESTKIT_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "MANGLER_TESTKIT_REQUIRE_ENGINES=1" >> "$GITHUB_ENV"
          test -x "$(command -v google-chrome)"
      - name: Build all targets
        timeout-minutes: 10
        run: cargo build --locked --all-targets
      - name: Full suite including QuickJS, Node and Chrome artifacts
        timeout-minutes: 20
        run: cargo test --locked --workspace -- --test-threads=2
      - name: Release build and minification throughput
        timeout-minutes: 12
        run: |
          cargo build --locked --release -p mangler-cli
          cargo test --locked --release -p mangler-js --test performance -- --nocapture
      - name: VM behavior and raw, gzip, Brotli size budgets
        timeout-minutes: 4
        run: '"$MANGLER_TESTKIT_NODE" scripts/measure-vm.cjs --binary target/release/mangler --check'

  lint:
    name: changed-file formatting + strict clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check-format.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
