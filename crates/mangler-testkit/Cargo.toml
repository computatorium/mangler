[package]
name = "mangler-testkit"
version = "0.2.0"
edition = "2024"
description = "Differential harness, corpus runner, proptest VM fuzz, and expansion/throughput bands."

[features]
# Engine execution is controlled by explicit environment paths, not a feature
# that CI can accidentally omit. Only property-based generation is optional.
default = ["proptest"]
proptest = ["dep:proptest"]

[dependencies]
rquickjs = { workspace = true }
proptest = { workspace = true, optional = true }

tempfile = "3"
serde_json = "1"
libc = "0.2"
