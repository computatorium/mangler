[package]
name = "mangler-testkit"
version = "0.2.0"
edition = "2024"
description = "Differential harness, corpus runner, proptest VM fuzz, and expansion/throughput bands."

[features]
# proptest is on by default; turn it off to drop the dep for a lean consumer that
# only wants eval/corpus/golden. `cross-engine` enables the optional second-engine
# (subprocess) differential path — OFF by default (see crate rustdoc: NEVER run
# bare `node` in tests).
default = ["proptest"]
proptest = ["dep:proptest"]
cross-engine = []

[dependencies]
rquickjs = { workspace = true }
proptest = { workspace = true, optional = true }
