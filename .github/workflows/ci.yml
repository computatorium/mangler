name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Build (debug, locked, all targets)
        run: cargo build --locked --all-targets

      - name: Unit tests (fast gate)
        run: cargo test --locked --lib

      - name: Full suite (integration + QuickJS differential)
        # The QuickJS differential/virtualize tests are slower and have hung in
        # pathological cases; cap the step so a hang fails fast instead of burning
        # the whole CI budget.
        timeout-minutes: 25
        run: cargo test --locked

  lint:
    name: fmt + clippy (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # Non-blocking for now: the tree is not yet rustfmt-clean and clippy is
      # untriaged. Drop `continue-on-error` to make these gates AFTER a one-time
      # `cargo fmt` + clippy cleanup (tracked as a follow-up).
      - name: rustfmt (check)
        continue-on-error: true
        run: cargo fmt --all --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --all-targets
